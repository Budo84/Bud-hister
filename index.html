<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hitster Universe</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/vinyl-record.png">

    <style>
        :root { 
            --accent: #fa2d48; --dark-bg: #121212; --card-bg: #1e1e1e; 
            --text-main: #ffffff; --text-sec: #bbbbbb; 
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font-stack); background-color: var(--dark-bg); color: var(--text-main); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; padding-top: env(safe-area-inset-top); overflow-x: hidden; }
        
        .app-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin: 10px 0 20px 0; font-size: clamp(1.8rem, 5vw, 2.5rem); color: var(--accent); letter-spacing: -1px; }
        
        .menu-section { width: 100%; display: flex; flex-direction: column; align-items: center; animation: fadeIn 0.3s ease; }
        .hidden { display: none !important; }

        .country-wrapper { background: var(--card-bg); padding: 8px 15px; border-radius: 50px; margin-bottom: 20px; display: inline-flex; align-items: center; border: 1px solid #333; }
        select { background: transparent; color: white; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; outline: none; }
        option { background: #222; }
        
        .category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; width: 100%; margin-bottom: 20px; }
        
        .btn { padding: 25px 15px; border: none; border-radius: 18px; font-size: 1.1rem; font-weight: 700; cursor: pointer; color: white; background-color: #333; transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn:active { transform: scale(0.95); }
        .btn-icon { font-size: 1.8rem; display: block; }

        .btn-main-1 { background: linear-gradient(135deg, #ff416c, #ff4b2b); width: 100%; max-width: 300px; margin-bottom: 15px; flex-direction: row; justify-content: center; padding: 20px; }
        .btn-main-2 { background: linear-gradient(135deg, #8E2DE2, #4A00E0); width: 100%; max-width: 300px; flex-direction: row; justify-content: center; padding: 20px; }
        .btn-back { background: #222; border: 1px solid #444; width: auto; padding: 12px 25px; flex-direction: row; border-radius: 50px; font-size: 0.9rem; margin-top: 10px; }

        .btn-film { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-tv { background: linear-gradient(135deg, #f09819, #edde5d); color: #1a1a1a; }
        .btn-cartoon { background: linear-gradient(135deg, #00b09b, #96c93d); }
        .btn-sara1 { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .btn-sara2 { background: linear-gradient(135deg, #fc4a1a, #f7b733); }
        .btn-sara3 { background: linear-gradient(135deg, #3a1c71, #d76d77, #ffaf7b); }
        .btn-sara4 { background: linear-gradient(135deg, #8E2DE2, #4A00E0); }

        #game-area { width: 100%; flex-direction: column; align-items: center; animation: fadeIn 0.5s ease; }
        .vinyl { width: clamp(150px, 35vh, 260px); height: clamp(150px, 35vh, 260px); border-radius: 50%; background: #222; border: 4px solid #444; display: flex; align-items: center; justify-content: center; animation: spin 4s linear infinite; box-shadow: 0 10px 40px rgba(0,0,0,0.6); font-size: 3rem; position: relative; }
        .vinyl::after { content: ''; position: absolute; width: 35%; height: 35%; background: var(--accent); border-radius: 50%; border: 3px solid white; }
        .vinyl.paused { animation-play-state: paused; opacity: 0.8; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: var(--card-bg); padding: 25px; border-radius: 24px; width: 100%; margin-top: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); border: 1px solid #333; }
        .hidden-info { filter: blur(15px); pointer-events: none; user-select: none; opacity: 0.8; }
        .revealed { filter: blur(0); pointer-events: auto; opacity: 1; }
        .year-badge { background: var(--accent); color: white; padding: 6px 16px; border-radius: 100px; font-weight: 800; font-size: 1.3rem; display: inline-block; margin-bottom: 12px; }
        .source-title { font-size: 1.4rem; font-weight: 800; margin: 10px 0; color: #fff; line-height: 1.2; }
        .song-details { color: var(--text-sec); font-size: 1rem; }
        
        /* Griglia a 3 bottoni per i controlli in gioco */
        .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: 100%; margin-top: 25px; }
        .btn-action { padding: 15px 5px; border-radius: 12px; border: none; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .btn-reveal { background: #fff; color: #000; }
        .btn-next-song { background: #1DB954; color: #fff; } /* Verde Spotify per la "Prossima" */
        .btn-back-cat { background: #333; color: #fff; border: 1px solid #444; }
        
        @supports(padding: max(0px)) { body { padding-bottom: max(20px, env(safe-area-inset-bottom)); } }
    </style>
</head>
<body>
    <div class="app-container">
        <h1 id="app-title">Hitster App 🎶</h1>

        <div id="main-menu" class="menu-section">
            <p style="color: var(--text-sec); margin-bottom:30px;">Cosa vuoi giocare oggi?</p>
            <button class="btn btn-main-1" onclick="navTo('cinema')"><span class="btn-icon">🎬</span> CineHitster</button>
            <button class="btn btn-main-2" onclick="navTo('sarabanda')"><span class="btn-icon">🎵</span> Sarabanda</button>
        </div>

        <div id="cinema-menu" class="menu-section hidden">
            <div class="country-wrapper">
                <label>Nazione:</label>
                <select id="country-picker">
                    <option value="IT" selected>🇮🇹 Italia</option>
                    <option value="US">🇺🇸 USA / Int.</option>
                    <option value="ES">🇪🇸 Spagna</option>
                    <option value="FR">🇫🇷 Francia</option>
                </select>
            </div>
            <div class="category-grid">
                <button class="btn btn-film" onclick="prepareCinema('film')"><span class="btn-icon">🎬</span> Film</button>
                <button class="btn btn-tv" onclick="prepareCinema('tv')"><span class="btn-icon">📺</span> Serie TV</button>
                <button class="btn btn-cartoon" onclick="prepareCinema('cartoon')"><span class="btn-icon">🏰</span> Cartoni</button>
            </div>
            <button class="btn btn-back" onclick="navTo('main')">🔙 Torna al menu principale</button>
        </div>

       <div id="sarabanda-menu" class="menu-section hidden">
            <p style="color: var(--text-sec); margin-bottom:20px; font-size: 0.95rem;">Scegli il repertorio musicale:</p>
            
            <div class="category-grid">
                <button class="btn" style="background: linear-gradient(135deg, #FF512F, #DD2476); grid-column: span 2;" onclick="prepareSarabanda('ita_all')">
                    <span class="btn-icon">🇮🇹</span> MIX ITALIA (1960-Oggi)
                </button>
                <button class="btn" style="background: linear-gradient(135deg, #1FA2FF, #12D8FA, #A6FFCB); color: #000; grid-column: span 2;" onclick="prepareSarabanda('int_all')">
                    <span class="btn-icon">🌍</span> MIX MONDO (1960-Oggi)
                </button>

                <button class="btn btn-sara1" onclick="prepareSarabanda('ita_old')"><span class="btn-icon">🍝</span> ITA '60-'90</button>
                <button class="btn btn-sara2" onclick="prepareSarabanda('ita_new')"><span class="btn-icon">📱</span> ITA 2000+</button>
                <button class="btn btn-sara3" onclick="prepareSarabanda('int_old')"><span class="btn-icon">🪩</span> INT '60-'90</button>
                <button class="btn btn-sara4" onclick="prepareSarabanda('int_new')"><span class="btn-icon">🎧</span> INT 2000+</button>
            </div>
            
            <button class="btn btn-back" onclick="navTo('main')">🔙 Torna al menu principale</button>
        </div>

        <div id="game-area" class="menu-section hidden">
            <div class="vinyl" id="vinyl-icon"></div>
            <p id="status-text" style="color:#888; margin-top:15px;">Caricamento...</p>
            
            <div id="solution-card" class="card hidden-info">
                <div class="year-badge" id="res-year">????</div>
                <div class="source-title" id="res-title">Titolo Principale</div>
                <div class="song-details"><span id="res-subtitle1">Sottotitolo 1</span> • <span id="res-subtitle2">Sottotitolo 2</span></div>
            </div>
            
            <div class="controls">
                <button class="btn btn-action btn-reveal" onclick="reveal()"><span>👁️</span> Rivela</button>
                <button class="btn btn-action btn-next-song" onclick="playNextSong()"><span>⏭️</span> Prossima</button>
                <button class="btn btn-action btn-back-cat" onclick="navBackFromGame()"><span>🔙</span> Categorie</button>
            </div>
            <audio id="audio-player"></audio>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() { navigator.serviceWorker.register('sw.js'); });
        }

        // --- VARIABILI DI STATO ---
        let currentMode = 'main';
        let currentActiveCategoryKey = ''; 
        let currentActiveCountryCode = '';

        function navTo(target) {
            document.querySelectorAll('.menu-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(target === 'main' ? 'main-menu' : target + '-menu').classList.remove('hidden');
            
            if (target === 'cinema') document.getElementById('app-title').innerText = "CineHitster 🎬";
            else if (target === 'sarabanda') document.getElementById('app-title').innerText = "Sarabanda 🎵";
            else document.getElementById('app-title').innerText = "Hitster App 🎶";
            
            currentMode = target;
        }

        function navBackFromGame() {
            resetUI();
            navTo(currentMode);
        }

        // --- DIZIONARI ---
        const CINEMA_TERMS = {
            IT: { film: ['colonna sonora film', 'film italiano soundtrack', 'ennio morricone'], tv: ['sigle serie tv', 'sigle telefilm'], cartoon: ['sigle cartoni animati', 'cristina d\'avena', 'sigle cartoni', 'giorgio vanni'] },
            US: { film: ['movie soundtrack', 'original score'], tv: ['tv theme song'], cartoon: ['disney soundtrack', 'pixar soundtrack'] },
            ES: { film: ['banda sonora'], tv: ['sintonias series'], cartoon: ['dibujos animados'] },
            FR: { film: ['bande originale'], tv: ['générique série'], cartoon: ['dessins animés'] }
        };

        const MUSIC_TERMS = {
            // Categorie "Vecchie" (Nostalgia)
            ita_old: ['successi italiani anni 60', 'musica italiana anni 70', 'festival sanremo anni 80', 'cantautori italiani storici', 'anni 90 dance italia', 'festivalbar compilation'],
            int_old: ['60s pop hits', '70s rock hits', '80s disco hits', '90s pop anthems', 'oldies but goldies', 'classic rock anthems'],

            // Categorie "Nuove" (Moderno)
            ita_new: ['tormentoni estivi 2000', 'pop italiano 2010', 'trap italia', 'sanremo 2020', 'nuova scena pop italiana', 'top 50 italia oggi'],
            int_new: ['2000s pop hits', '2010s club hits', 'tiktok viral hits', 'global top 50', 'billboard hot 100 today'],

            // --- NUOVE CATEGORIE "MIX TOTALE" (1960 - OGGI) ---
            ita_all: [
                'migliori canzoni italiane anni 60', 
                'successi italiani anni 70', 
                'sanremo anni 80', 
                'festivalbar anni 90', 
                'pop italiano 2000', 
                'hit italia 2010', 
                'classifiche musica italiana oggi',
                'storia della musica italiana'
            ],
            int_all: [
                'best songs of the 60s', 
                '70s greatest hits', 
                '80s number one hits', 
                '90s party hits', 
                '2000s throwback', 
                'top hits 2010s', 
                'current pop hits',
                'greatest hits of all time'
            ]
        };

        function checkConnection() {
            if (!navigator.onLine) { alert("⚠️ Attenzione: Sei offline."); return false; }
            return true;
        }

        function searchItunes(term, country) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                const callbackName = 'itunes_' + Math.round(100000 * Math.random());
                window[callbackName] = function(data) { delete window[callbackName]; document.body.removeChild(script); resolve(data.results); };
                const url = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&country=${country}&media=music&entity=song&limit=150&callback=${callbackName}`;
                script.src = url; document.body.appendChild(script);
            });
        }

        // --- AVVIO GIOCO DA CATEGORIE ---
        async function prepareCinema(categoryKey) {
            if(!checkConnection()) return;
            currentActiveCategoryKey = categoryKey;
            currentActiveCountryCode = document.getElementById('country-picker').value;
            
            const possibleTerms = (CINEMA_TERMS[currentActiveCountryCode] || CINEMA_TERMS['US'])[categoryKey];
            const searchTerm = possibleTerms[Math.floor(Math.random() * possibleTerms.length)];
            await startGame(searchTerm, currentActiveCountryCode, 'cinema');
        }

        async function prepareSarabanda(categoryKey) {
            if(!checkConnection()) return;
            currentActiveCategoryKey = categoryKey;
            currentActiveCountryCode = categoryKey.startsWith('ita') ? 'IT' : 'US';

            const possibleTerms = MUSIC_TERMS[categoryKey];
            const searchTerm = possibleTerms[Math.floor(Math.random() * possibleTerms.length)];
            await startGame(searchTerm, currentActiveCountryCode, 'sarabanda');
        }

        // TASTO PROSSIMA CANZONE
        function playNextSong() {
            if (currentMode === 'cinema') {
                prepareCinema(currentActiveCategoryKey);
            } else if (currentMode === 'sarabanda') {
                prepareSarabanda(currentActiveCategoryKey);
            }
        }

        // --- MOTORE DI GIOCO ---
        async function startGame(searchTerm, countryCode, mode) {
            document.querySelectorAll('.menu-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('game-area').classList.remove('hidden');
            document.getElementById('status-text').innerText = "Cerco la traccia originale...";
            resetUI();

            try {
                const tracks = await searchItunes(searchTerm, countryCode);
                if (!tracks || tracks.length === 0) { alert("Nessuna canzone trovata! Riprova."); navBackFromGame(); return; }
                
                // FILTRO "ANTI-BASI" E "ORIGINALI"
                let validTracks = tracks.filter(t => {
                    if (!t.previewUrl) return false;
                    
                    let trackStr = (t.trackName + " " + t.artistName + " " + t.collectionName).toLowerCase();
                    const forbiddenWords = ['karaoke', 'instrumental', 'base musicale', 'tribute', 'cover', 'remaster', 'live version', 'in the style of', 'tribute to', 'strumentale'];
                    
                    for (let word of forbiddenWords) {
                        if (trackStr.includes(word)) return false; // Scarta la canzone
                    }
                    return true;
                });

                // Rete di sicurezza: se il filtro ha eliminato TUTTO (es. canzoni anni 60 esistono solo rimasterizzate), abbassiamo gli standard
                if(validTracks.length === 0) validTracks = tracks.filter(t => t.previewUrl);
                
                const randomTrack = validTracks[Math.floor(Math.random() * validTracks.length)];
                document.getElementById('res-year').innerText = randomTrack.releaseDate.substring(0, 4);

                if (mode === 'cinema') {
                    let filmTitle = randomTrack.collectionName || randomTrack.trackName;
                    filmTitle = filmTitle.replace(/Original Motion Picture Soundtrack/gi, "").replace(/\(OST\)/gi, "").replace(/Music From The Motion Picture/gi, "").replace(/Colonna Sonora Originale/gi, "").replace(/Le più belle sigle/gi, "").replace(/Cristina D'Avena/gi, "").split(/[-(]/)[0].trim();
                    if (filmTitle.length < 2) filmTitle = "Colonna Sonora";
                    
                    document.getElementById('res-title').innerText = filmTitle;
                    document.getElementById('res-subtitle1').innerText = randomTrack.trackName;
                    document.getElementById('res-subtitle2').innerText = randomTrack.artistName;
                } 
                else if (mode === 'sarabanda') {
                    let cleanSongTitle = randomTrack.trackName.replace(/\(Remastered.*\)/gi, "").replace(/\(Radio Edit\)/gi, "").replace(/\(Live.*\)/gi, "").trim();
                    
                    document.getElementById('res-title').innerText = cleanSongTitle;
                    document.getElementById('res-subtitle1').innerText = randomTrack.artistName;
                    document.getElementById('res-subtitle2').innerText = randomTrack.collectionName || "Singolo";
                }

                // RIPRODUZIONE AUDIO
                const audio = document.getElementById('audio-player');
                if(randomTrack.previewUrl) {
                    audio.src = randomTrack.previewUrl; audio.volume = 1.0;
                    audio.oncanplay = () => { audio.play(); document.getElementById('vinyl-icon').classList.remove('paused'); document.getElementById('status-text').innerText = "Ascolta e indovina l'anno!"; };
                } else { playNextSong(); } // Ripesca autom. se per caso manca l'audio
                
            } catch (error) { alert("Errore connessione ai server musicali."); navBackFromGame(); }
        }

        function reveal() { 
            document.getElementById('solution-card').classList.add('revealed'); 
            document.getElementById('vinyl-icon').classList.add('paused'); 
            document.getElementById('status-text').innerText = "Soluzione:"; 
        }
        
        function resetUI() { 
            document.getElementById('solution-card').classList.remove('revealed'); 
            document.getElementById('audio-player').pause(); 
            document.getElementById('vinyl-icon').classList.add('paused'); 
        }
    </script>
</body>
</html>
